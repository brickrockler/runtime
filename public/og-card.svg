<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid48" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#000000" stroke-opacity="0.28" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="#ff0400"/>
  <rect width="1200" height="630" fill="url(#grid48)"/>

  <!-- Solid black hard shadow + Clean solid #ff0400 box (NO grid inside box!) -->
  <rect x="54" y="48" width="1100" height="542" fill="#000000"/>
  <rect x="44" y="38" width="1100" height="542" fill="#ff0400" stroke="#000000" stroke-width="4"/>

  <!-- 4-corner registration crosshairs -->
  <g stroke="#000000" stroke-width="3">
    <path d="M58 58h12M64 52v12"/>
    <path d="M1120 58h12M1126 52v12"/>
    <path d="M58 560h12M64 554v12"/>
    <path d="M1120 560h12M1126 554v12"/>
  </g>

  <!-- Monumental 5x7 Pixel RUNTIME Wordmark (scaled cleanly inside solid card) -->
  <g transform="translate(88, 86) scale(21.5)" fill="#000000" shape-rendering="crispEdges">
    <path d="M0 0h4v1h1v2H4v1H2v1h2v1h1v1H3V6H2V5H1v2H0V0zm1 1v2h3V1H1z"/>
    <path d="M7 0h1v6h3V0h1v6h-1v1H8V6H7V0z"/>
    <path d="M14 0h1v1h1v1h1v1h1V0h1v7h-1V4h-1V3h-1V2h-1v5h-1V0z"/>
    <path d="M21 0h5v1h-2v6h-1V1h-2V0z"/>
    <path d="M28 0h5v1h-2v5h2v1h-5V6h2V1h-2V0z"/>
    <path d="M35 0h1v1h1v1h1V1h1V0h1v7h-1V3h-1v1h-1V3h-1v4h-1V0z"/>
    <path d="M42 0h5v1h-4v2h3v1h-3v2h4v1h-5V0z"/>
  </g>

  <!-- Punchy subhead -->
  <text x="88" y="286" fill="#000000" font-family="'IBM Plex Mono', Menlo, monospace" font-weight="700" font-size="31" letter-spacing="-0.5">Oh, you wanna burn some tokens?</text>
  <text x="88" y="328" fill="#000000" font-family="'IBM Plex Mono', Menlo, monospace" font-weight="700" font-size="31" letter-spacing="-0.5">Not until you burn some calories, punk.</text>

  <!-- Clean solid #000000 terminal bay with ZERO text inside — pure sprinter chasing 2-armed runaway monitor -->
  <rect x="94" y="366" width="1012" height="178" fill="#000000"/>
  <g fill="#ff0400" shape-rendering="crispEdges">
    <!-- Sprinter on left -->
    <g transform="translate(270, 392) scale(8)">
      <rect x="4" y="0" width="4" height="3"/>
      <rect x="5" y="3" width="2" height="2"/>
      <rect x="2" y="5" width="9" height="2"/>
      <rect x="1" y="7" width="2" height="2"/>
      <rect x="10" y="4" width="2" height="2"/>
      <rect x="4" y="7" width="4" height="4"/>
      <rect x="3" y="11" width="2" height="3"/>
      <rect x="7" y="11" width="3" height="2"/>
      <rect x="1" y="14" width="3" height="2"/>
      <rect x="9" y="13" width="3" height="2"/>
      <rect x="-3" y="13" width="1" height="1"/>
      <rect x="-6" y="15" width="1" height="1"/>
    </g>
    <!-- Two-armed runaway CRT monitor on right -->
    <g transform="translate(700, 390) scale(8)">
      <!-- Monitor bezel -->
      <rect x="3" y="0" width="11" height="1"/>
      <rect x="3" y="9" width="11" height="1"/>
      <rect x="3" y="0" width="1" height="10"/>
      <rect x="13" y="0" width="1" height="10"/>
      <!-- Left arm UP -->
      <rect x="0" y="3" width="3" height="1"/>
      <rect x="0" y="1" width="1" height="2"/>
      <!-- Right arm DOWN -->
      <rect x="14" y="3" width="3" height="1"/>
      <rect x="16" y="4" width="1" height="2"/>
      <!-- Panicked eyes & mouth -->
      <rect x="6" y="3" width="1" height="3"/>
      <rect x="10" y="3" width="1" height="3"/>
      <rect x="7" y="7" width="3" height="1"/>
      <!-- Running legs -->
      <rect x="6" y="10" width="1" height="2"/>
      <rect x="10" y="10" width="1" height="2"/>
      <rect x="4" y="12" width="2" height="2"/>
      <rect x="11" y="12" width="2" height="2"/>
      <rect x="2" y="14" width="3" height="2"/>
      <rect x="12" y="14" width="3" height="2"/>
    </g>
    <!-- Ground dashes -->
    <rect x="94" y="520" width="1012" height="3"/>
    <rect x="94" y="527" width="1012" height="3"/>
  </g>
</svg>
